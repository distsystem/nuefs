[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuefs"
version = "0.2.0"
requires-python = ">=3.12"
description = "NueFS - FUSE-based layered filesystem for Python"
dependencies = [
  "betterproto2>=0.9.0",
  "pydantic-settings>=2.0",
  "pyyaml",
  "rich>=13.0",
  "pathspec",
]

[project.scripts]
git-nue = "nuefs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/nuefs"]

[tool.hatch.build.targets.wheel.hooks.custom]
