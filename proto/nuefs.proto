syntax = "proto3";
package nuefs;

// -- Data types --

message ManifestEntry {
  string virtual_path = 1;
  string backend_path = 2;
  bool is_dir = 3;
}

message MountRoot {
  string virtual_prefix = 1;
  string backend_path = 2;
}

message OwnerInfo {
  string owner = 1;
  string backend_path = 2;
}

message MountStatus {
  uint64 mount_id = 1;
  string root = 2;
}

message DaemonInfo {
  uint32 pid = 1;
  string socket = 2;
  uint64 started_at = 3;
}

// -- Requests --

message MountReq {
  string root = 1;
  repeated ManifestEntry entries = 2;
  repeated MountRoot mount_roots = 3;
}

message UnmountReq { uint64 mount_id = 1; }
message WhichReq { uint64 mount_id = 1; string path = 2; }
message StatusReq {}
message DaemonInfoReq {}

message UpdateReq {
  uint64 mount_id = 1;
  repeated ManifestEntry entries = 2;
  repeated MountRoot mount_roots = 3;
}

message ResolveReq { string root = 1; }
message ShutdownReq {}

// -- Responses --

message MountResp { uint64 mount_id = 1; }
message UnmountResp {}
message WhichResp { OwnerInfo owner_info = 1; }
message StatusResp { repeated MountStatus mounts = 1; }
message DaemonInfoResp { DaemonInfo info = 1; }
message UpdateResp {}
message ResolveResp { optional uint64 mount_id = 1; }
message ShutdownResp {}

// -- Service --

service NueFs {
  rpc Mount(MountReq) returns (MountResp);
  rpc Unmount(UnmountReq) returns (UnmountResp);
  rpc Which(WhichReq) returns (WhichResp);
  rpc Status(StatusReq) returns (StatusResp);
  rpc GetDaemonInfo(DaemonInfoReq) returns (DaemonInfoResp);
  rpc Update(UpdateReq) returns (UpdateResp);
  rpc Resolve(ResolveReq) returns (ResolveResp);
  rpc Shutdown(ShutdownReq) returns (ShutdownResp);
}
