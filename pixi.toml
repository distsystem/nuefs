[workspace]
channels = ["https://repo.prefix.dev/meta-forge", "conda-forge"]
name = "nuefs"
platforms = ["linux-64"]
preview = ["pixi-build"]

[package]
name = "nuefs"
version = "0.2.0" # x-release-please-version

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"]

[package.build.config]
noarch = false
compilers = ["c"]
extra-input-globs = ["nuefsd/src/**/*.rs", "nuefsd/Cargo.toml", "nuefsd/Cargo.lock"]

[package.host-dependencies]
hatchling = "*"
python = "=3.12"
rust = ">=1.85"
libfuse3 = "*"

[package.run-dependencies]
python = ">=3.12"
betterproto2 = ">=0.9.0"
pydantic-settings = ">=2.0"
pyyaml = "*"
rich = ">=13.0"
pathspec = "*"
pygit2 = "*"
libfuse3 = "*"

[feature.proto.dependencies]
buf = "*"
ruff = "~=0.9.3"
grpcio = "*"
betterproto2 = "*"
rust = "*"

[feature.proto.tasks]
protogen = "cargo install protoc-gen-prost --root \"$CONDA_PREFIX\" --quiet && buf generate proto"

[feature.proto.pypi-dependencies]
betterproto2-compiler = ">=0.9.0"

[environments]
proto = { features = ["proto"], no-default-feature = true }

[tasks]
check = "cargo check --manifest-path nuefsd/Cargo.toml"
kill = "pkill -9 nuefsd || true"
stop = "nue stop 2>/dev/null || pkill -9 nuefsd || true"
test = "pytest tests -v"
bench = "python -m tests.bench_fio"
posixtest = "python -m uposixtest"

[dependencies]
nuefs = { path = "." }
pytest = "*"
python = "=3.12"
humanize = "*"
packageurl-python = "*"
universal-pathlib = "*"

[pypi-dependencies]
uposixtest = { path = "uposixtest", editable = true }
