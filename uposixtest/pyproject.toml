[project]
name = "uposixtest"
version = "0.1.0"
requires-python = ">=3.12"
description = "Unprivileged POSIX filesystem conformance tests"

[project.scripts]
uposixtest = "uposixtest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uposixtest"]
