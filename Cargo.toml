[package]
name = "nue"
version = "0.0.1"
edition = "2024"
description = "Proof-of-concept: file-level vendoring via josh filter + commit replay"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
git2 = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "nue"
path = "src/main.rs"
