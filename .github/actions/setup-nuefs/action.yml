name: Setup NueFS
description: Install nuefs from conda package and optionally mount a workspace

inputs:
  version:
    description: Release version to install (latest/v0.2.0/0.2.0).
    default: latest
  conda-url:
    description: >
      Override: path or URL to a .conda file. Local paths support globs.
      When set, version is ignored.
    default: ""
  manifest:
    description: >
      Path to nue.yaml. When set, runs `nue mount -m <manifest>` after install.
    default: ""
  manifest-content:
    description: >
      Inline nue.yaml content. Written to <mountpoint>/nue.yaml.
      Source paths resolve relative to mountpoint.
      Takes precedence over manifest when both are set.
    default: ""
  mountpoint:
    description: >
      Directory where the FUSE filesystem is mounted. Inline config is
      written here; source paths in the manifest resolve relative to it.
    default: "."

runs:
  using: composite
  steps:
    - name: Install fuse3
      shell: bash
      run: sudo apt-get install -y -qq fuse3 > /dev/null

    - name: Resolve conda package
      id: conda
      shell: bash
      env:
        CONDA_URL: ${{ inputs.conda-url }}
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p /tmp/nuefs-conda

        if [ -n "$CONDA_URL" ]; then
          if [[ "$CONDA_URL" =~ ^https?:// ]]; then
            curl -fsSL -o /tmp/nuefs-conda/nuefs.conda "$CONDA_URL"
            conda_path=/tmp/nuefs-conda/nuefs.conda
          else
            files=( $CONDA_URL )
            conda_path="${files[0]}"
          fi
        else
          if [ "$VERSION" = "latest" ]; then
            gh release download --repo distsystem/nuefs \
              --pattern '*.conda' --dir /tmp/nuefs-conda
          else
            ver="${VERSION#v}"
            gh release download "nuefs-v${ver}" --repo distsystem/nuefs \
              --pattern '*.conda' --dir /tmp/nuefs-conda
          fi
          files=( /tmp/nuefs-conda/*.conda )
          conda_path="${files[0]}"
        fi

        if [ ! -f "$conda_path" ]; then
          echo "::error::No .conda file found"
          exit 1
        fi

        echo "path=$conda_path" >> "$GITHUB_OUTPUT"

    - name: Install nuefs globally
      shell: bash
      env:
        CONDA_PATH: ${{ steps.conda.outputs.path }}
      run: |
        pixi_tmp="$(mktemp -d)"
        curl -fsSL "https://github.com/fecet/pixi/releases/download/v0.63.2/pixi-x86_64-unknown-linux-musl.tar.gz" \
          | tar -xz -C "$pixi_tmp"

        "$pixi_tmp/pixi" global install nuefs \
          --path "$CONDA_PATH" \
          -c https://repo.prefix.dev/meta-forge \
          -c conda-forge

        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
        rm -rf "$pixi_tmp"

    - name: Write inline manifest
      if: inputs.manifest-content != ''
      shell: bash
      env:
        MANIFEST_CONTENT: ${{ inputs.manifest-content }}
      run: printf '%s\n' "$MANIFEST_CONTENT" > "${{ inputs.mountpoint }}/nue.yaml"

    - name: Mount workspace
      if: inputs.manifest != '' || inputs.manifest-content != ''
      shell: bash
      run: |
        if [ -n "${{ inputs.manifest-content }}" ]; then
          nue mount -m "${{ inputs.mountpoint }}/nue.yaml"
        else
          nue mount -m "${{ inputs.manifest }}"
        fi
