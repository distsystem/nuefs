name: Test pixi install on FUSE mount

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-mundi-install:
    runs-on: ubuntu-latest
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pulumi/esc-action@v1
        with:
          environment: distsystem-dev/mundi

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.13
        with:
          pixi-version: v0.63.2
          pixi-url: https://github.com/fecet/pixi/releases/download/{{version}}/{{pixiFile}}

      - name: Build nuefs
        run: pixi run -e build develop

      - name: Checkout mundi
        run: gh repo clone distsystem/mundi ../mundi -- --depth 1

      - name: Clone meta-forge
        run: gh repo clone distsystem/meta-forge ../meta-forge -- --depth 1

      - name: Mount workspace
        run: |
          sudo apt-get install -y -qq fuse3 > /dev/null
          cd ../mundi && nue mount

      - name: Setup mundi project
        working-directory: ../mundi
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          pixi config set detached-environments true
          pixi install --frozen

      - name: Verify meta works
        working-directory: ../mundi
        run: pixi run meta --help

      - name: Setup Tailscale
        if: failure()
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Start SSH and wait for debug
        if: failure()
        run: |
          echo runner:ci-debug | sudo chpasswd
          sudo systemctl start ssh
          echo "::notice::SSH into runner: ssh runner@$(tailscale ip -4) (password: ci-debug)" && sleep 18000
