package:
  name: nuefs
  version: 0.1.0

source:
  path: .
  use_gitignore: true

build:
  number: 0
  noarch: python
  script: |
    $PYTHON -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - python =3.12
    - pip
    - hatchling
  run:
    - python >=3.12
    - betterproto2 >=0.9.0
    - pydantic-settings >=2.0
    - pyyaml
    - rich >=13.0
    - pathspec
    - pygit2

tests:
  - script:
      - nue --help
      - python -c "import nuefs"
